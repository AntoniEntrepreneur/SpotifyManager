[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotify-manager"
version = "0.1.0"
description = "Command-line tool for managing a personal Spotify library, starting with saved-album deduplication."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "spotipy>=2.26",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
spotify-manager = "spotify_manager.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
